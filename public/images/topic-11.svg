<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Мэдээллийн аюулгүй байдлын үндэс</title>
  <desc id="desc">CIA гурвал болон найман төрлийн кибер халдлагыг дүрсэлсэн зураг</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#0b2d3c"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#22d3ee" stop-opacity=".38"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <circle cx="915" cy="315" r="300" fill="url(#glow)"/>
  <g fill="none" stroke="#67e8f9" stroke-opacity=".18"><path d="M0 112h260l55 55h182"/><path d="M0 560h245l62-62h177"/><path d="M790 70h230l52 52h128"/><path d="M820 600h190l55-55h135"/></g>
  <text x="70" y="115" fill="#67e8f9" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="5">МЭДЭЭЛЛИЙН АЮУЛГҮЙ БАЙДАЛ</text>
  <text x="70" y="210" fill="#f8fafc" font-family="Arial,sans-serif" font-size="58" font-weight="800">Мэдээлэл · CIA · Халдлага</text>
  <text x="70" y="270" fill="#a5c3d3" font-family="Arial,sans-serif" font-size="25">Энгийн тайлбар, бодит жишээ, алхамчилсан зураглал</text>
  <g transform="translate(80 340)" font-family="Arial,sans-serif" text-anchor="middle">
    <circle cx="105" cy="95" r="82" fill="#8b5cf6"/><text x="105" y="87" fill="white" font-size="36" font-weight="800">C</text><text x="105" y="120" fill="white" font-size="18">Нууцлал</text>
    <circle cx="290" cy="95" r="82" fill="#0ea5e9"/><text x="290" y="87" fill="white" font-size="36" font-weight="800">I</text><text x="290" y="120" fill="white" font-size="18">Бүрэн бүтэн</text>
    <circle cx="475" cy="95" r="82" fill="#22c55e"/><text x="475" y="87" fill="white" font-size="36" font-weight="800">A</text><text x="475" y="120" fill="white" font-size="18">Хүртээмж</text>
  </g>
  <g transform="translate(750 175)" fill="#071827" stroke="#67e8f9" stroke-width="3" font-family="Arial,sans-serif" text-anchor="middle">
    <rect width="350" height="330" rx="36" fill="#071827" fill-opacity=".72"/>
    <path d="M175 58l92 36v70c0 69-38 113-92 142-54-29-92-73-92-142V94z" fill="#22d3ee" fill-opacity=".14" stroke-width="6"/>
    <path d="M129 166l32 33 67-76" stroke="#67e8f9" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="175" y="290" fill="#f8fafc" stroke="none" font-size="20" font-weight="700">8 ТӨРЛИЙН ХАЛДЛАГА</text>
  </g>
